    <!-- مكتبات Firebase الكلاسيكية (Compat) لضمان العمل على AppsGeyser بدون أخطاء Modules -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>

    <script>
        // عزل الأكواد بـ (IIFE) لتجنب أي تضارب مع إعلانات AppsGeyser
        (function() {
            
            // 1. معالج الأخطاء العالمي: إذا حدث خطأ سنراه في مربع البحث بدلاً من الشاشة البيضاء
            window.addEventListener('error', function(e) {
                const s = document.getElementById('search-input');
                if(s) s.value = "Error: " + e.message;
            });
            window.addEventListener('unhandledrejection', function(e) {
                const s = document.getElementById('search-input');
                if(s) s.value = "Promise Error: " + e.reason;
            });

            const dict = {
                search_ph: { ar: "البحث عبر Mapbox...", en: "Search Mapbox...", ku: "گەڕان..." },
                calc: { ar: "جارٍ الحساب...", en: "Calculating...", ku: "هەژمار دەکرێت..." },

                auth_success: { ar: "تم تسجيل الدخول!", en: "Logged in!", ku: "چوویتە ژوورەوە!" }, verified: { ar: "سائق موثوق", en: "Verified Driver", ku: "شۆفێری باوەڕپێکراو" },
                member: { ar: "عضو Traffix", en: "Traffix Member", ku: "ئەندامی ترافیکس" }, offline_mode: { ar: "وضع بدون إنترنت", en: "Offline Mode", ku: "دۆخی بێ ئینتەرنێت" },
                sat_connect: { ar: "جارٍ الاتصال...", en: "Connecting...", ku: "پەیوەندی..." }, gps_stop: { ar: "تم الإيقاف", en: "Tracking stopped", ku: "وەستێنرا" },
                dist_away: { ar: "على بُعد", en: "away", ku: "بە دووری" }, dest_set: { ar: "تم تحديد الوجهة", en: "Set destination", ku: "مەبەست دیاریکرا" },
                saved_places: { ar: "الأماكن المحفوظة", en: "Saved Places", ku: "شوێنە پارێزراوەکان" }, home: { ar: "المنزل", en: "Home", ku: "ماڵەوە" }, work: { ar: "العمل", en: "Work", ku: "کار" }, set_success: { ar: "تم الحفظ", en: "Saved", ku: "پارێزرا" }
            };

            // 2. حماية الذاكرة (LocalStorage) لأن بعض الـ WebViews تمنعها
            let currentLang = 'ar';
            try {
                currentLang = localStorage.getItem('traffix_lang') || 'ar';
            } catch(e) { console.warn("LocalStorage Blocked"); }

            function t(key) { return dict[key] && dict[key][currentLang] ? dict[key][currentLang] : key; }

            let map, db, auth, currentUser, routingControl = null, watchId = null, userLocationMarker = null;
            const markersMap = {}, markersData = {}, alertedMarkers = new Set(); 
            let audioCtx, isAudioEnabled = false;
            const BAGHDAD_CENTER = [33.3152, 44.3661];

            function showToast(message, type = 'info') {
                try {
                    const toast = document.getElementById('toast'), msgEl = document.getElementById('toast-message'), iconEl = document.getElementById('toast-icon');
                    msgEl.textContent = message; toast.className = 'fixed top-24 left-1/2 transform -translate-x-1/2 text-white px-6 py-3 rounded-full shadow-2xl z-[3000] flex items-center gap-3 font-bold transition-opacity duration-300 pointer-events-none w-max max-w-[90%]';
                    if (type === 'success') { toast.classList.add('bg-green-600'); iconEl.className = 'fas fa-check-circle text-xl'; }
                    else if (type === 'error') { toast.classList.add('bg-red-600'); iconEl.className = 'fas fa-triangle-exclamation text-xl'; }
                    else { toast.classList.add('bg-gray-800'); iconEl.className = 'fas fa-info-circle text-xl'; }
                    toast.classList.remove('hidden'); void toast.offsetWidth; toast.style.opacity = '1';
                    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => { toast.classList.add('hidden'); }, 300); }, 3500);
                } catch(e) {}
            }

            function getReportConfig() {
                return {
                    'traffic': { icon: 'fa-car', bgClass: 'bg-red-500', name: t('traffic'), color: 'text-white' },
                    'accident': { icon: 'fa-car-burst', bgClass: 'bg-orange-500', name: t('accident'), color: 'text-white' },
                    'hazard': { icon: 'fa-triangle-exclamation', bgClass: 'bg-yellow-400', name: t('hazard'), color: 'text-gray-900' },
                    'police': { icon: 'fa-shield-halved', bgClass: 'bg-blue-600', name: t('police'), color: 'text-white' },
                    'roadblock': { icon: 'fa-road-barrier', bgClass: 'bg-gray-800 border-2 border-red-500', name: t('roadblock'), color: 'text-white' },
                    'camera': { icon: 'fa-camera', bgClass: 'bg-slate-700', name: t('camera'), color: 'text-white' }
                };
            }

            function enableAudio() {
                if (isAudioEnabled) return;
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state === 'suspended') audioCtx.resume();
                    if(window.speechSynthesis) { const u = new SpeechSynthesisUtterance(''); window.speechSynthesis.speak(u); }
                    isAudioEnabled = true; document.getElementById('audio-badge').classList.add('hidden');
                } catch(e) {}
            }

            function playAlertTone() {
                if (!audioCtx) return; 
                try {
                    const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
                    osc.type = 'square'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.connect(gainNode); gainNode.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } catch(e){}
            }

            function speakAlert(text) {
                try {
                    if (!window.speechSynthesis || !isAudioEnabled) return; window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text); utterance.lang = (currentLang === 'en') ? 'en-US' : 'ar-SA';
                    utterance.rate = 1.0; window.speechSynthesis.speak(utterance);
                } catch(e){}
            }

            async function fetchWeather(lat, lng) {
                try {
                    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weather_code`);
                    const data = await res.json();
                    if(data && data.current) {
                        const temp = Math.round(data.current.temperature_2m); const code = data.current.weather_code; let icon = 'fa-cloud-sun'; 
                        if(code <= 1) icon = 'fa-sun text-yellow-400'; else if(code <= 3) icon = 'fa-cloud text-gray-300'; else if(code <= 48) icon = 'fa-smog text-gray-400'; else if(code <= 67 || code >= 80) icon = 'fa-cloud-rain text-blue-300';
                        document.getElementById('weather-widget').classList.remove('hidden'); document.getElementById('weather-temp').textContent = `${temp}°C`; document.getElementById('weather-icon').className = `fas ${icon} text-xl mb-0.5 drop-shadow-sm`;
                    }
                } catch(e) { document.getElementById('weather-widget').classList.add('hidden'); }
            }

            // 3. تهيئة الخريطة فوراً بدون انتظار DOM لكي نتجنب الشاشة البيضاء
            try {
                map = L.map('map', { zoomControl: false, attributionControl: false }).setView(BAGHDAD_CENTER, 13);
                L.tileLayer('https://mt1.google.com/vt/lyrs=m&hl=' + currentLang + '&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(map);
                setTimeout(() => { if(map) map.invalidateSize(); }, 500);
                setTimeout(() => { if(map) map.invalidateSize(); }, 1500);
            } catch(e) {
                document.getElementById('search-input').value = "Map Error: " + e.message;
            }

            // 4. تعريف دوال الواجهة كمتغيرات آمنة
            const setAppLang = function(lang) {
                currentLang = lang; 
                try { localStorage.setItem('traffix_lang', lang); } catch(e){}
                document.documentElement.lang = lang; document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
                document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
                document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
                if(document.getElementById('btn_lbl_traffic')) {
                    document.getElementById('btn_lbl_traffic').textContent = t('traffic'); document.getElementById('btn_lbl_accident').textContent = t('accident');
                    document.getElementById('btn_lbl_hazard').textContent = t('hazard'); document.getElementById('btn_lbl_police').textContent = t('police');
                    document.getElementById('btn_lbl_roadblock').textContent = t('roadblock'); document.getElementById('btn_lbl_camera').textContent = t('camera');
                }
                document.getElementById('lang-menu').classList.add('hidden');
                updateSavedPlacesUI();
            };

            setAppLang(currentLang);

            // أزرار اللغة والوضع الليلي
            document.getElementById('btn-lang').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('lang-menu').classList.toggle('hidden'); });
            document.addEventListener('click', () => { document.getElementById('lang-menu').classList.add('hidden'); });
            document.getElementById('lang-ar').addEventListener('click', () => setAppLang('ar'));
            document.getElementById('lang-en').addEventListener('click', () => setAppLang('en'));
            document.getElementById('lang-ku').addEventListener('click', () => setAppLang('ku'));
            
            document.getElementById('btn-dark-mode').addEventListener('click', () => { document.documentElement.classList.toggle('dark'); });

            // النوافذ (Modals)
            const reportMenu = document.getElementById('report-menu');
            document.getElementById('btn-open-report').addEventListener('click', () => reportMenu.classList.remove('hidden'));
            document.getElementById('btn-close-report').addEventListener('click', () => reportMenu.classList.add('hidden'));
            reportMenu.addEventListener('click', (e) => { if (e.target === reportMenu) reportMenu.classList.add('hidden'); });

            const routesModal = document.getElementById('routes-modal');
            document.getElementById('btn-routes').addEventListener('click', () => { routesModal.classList.remove('hidden'); updateSavedPlacesUI(); });
            document.getElementById('btn-close-routes').addEventListener('click', () => routesModal.classList.add('hidden'));

            const profileModal = document.getElementById('profile-modal');
            document.getElementById('btn-profile').addEventListener('click', () => profileModal.classList.remove('hidden'));
            document.getElementById('btn-close-profile').addEventListener('click', () => profileModal.classList.add('hidden'));

            // دالة رسم المسار (محمية بـ Try Catch)
            window.drawRoute = function(lat, lng, destinationName) {
                try {
                    const end = L.latLng(lat, lng);
                    if (routingControl) { map.removeControl(routingControl); routingControl = null; }
                    document.querySelectorAll('.custom-dest').forEach(el => el.remove()); document.getElementById('weather-widget').classList.add('hidden');
                    
                    L.marker(end, { icon: L.divIcon({ html: `<div class="bg-brand-600 text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg border-2 border-white"><i class="fas fa-flag-checkered"></i></div>`, className: 'custom-dest', iconSize: [40, 40], iconAnchor: [20, 40] }) }).addTo(map);
                    
                    document.getElementById('search-container').classList.add('hidden'); document.getElementById('search-results').classList.add('hidden'); document.getElementById('search-input').value = '';
                    
                    if (!userLocationMarker) {
                        map.flyTo(end, 16, { animate: true, duration: 1.5 }); showToast(`${t('dest_set')} ${destinationName}`, "info");
                        const btnCancel = document.createElement('button'); btnCancel.className = 'absolute top-20 end-4 bg-white dark:bg-darkcard text-red-500 w-12 h-12 rounded-full shadow-lg z-[1500] flex items-center justify-center border border-gray-100 dark:border-gray-700 custom-dest pointer-events-auto';
                        btnCancel.innerHTML = '<i class="fas fa-times text-xl"></i>'; btnCancel.onclick = () => { document.querySelectorAll('.custom-dest').forEach(el => el.remove()); document.getElementById('search-container').classList.remove('hidden'); };
                        document.body.appendChild(btnCancel); fetchWeather(lat, lng); return;
                    }

                    document.getElementById('nav-banner').classList.remove('hidden'); document.getElementById('nav-dest').textContent = destinationName; document.getElementById('nav-eta').textContent = t('calc');
                    if(currentLang === 'en') document.getElementById('nav-arrow-icon').classList.add('scale-x-[-1]'); else document.getElementById('nav-arrow-icon').classList.remove('scale-x-[-1]');
                    
                    const start = userLocationMarker.getLatLng(); showToast(t('calc'), "info"); fetchWeather(lat, lng);

                    routingControl = L.Routing.control({
                        waypoints: [start, end], router: L.Routing.osrmv1({ language: (currentLang === 'ku' ? 'ar' : currentLang), profile: 'car' }),
                        lineOptions: { styles: [{color: '#4f46e5', opacity: 0.9, weight: 8}] }, createMarker: function() { return null; }, fitSelectedRoutes: true, showAlternatives: false
                    }).addTo(map);

                    routingControl.on('routesfound', function(e) {
                        const summary = e.routes[0].summary; const totalTimeMinutes = Math.round(summary.totalTime / 60); const totalDistKm = (summary.totalDistance / 1000).toFixed(1);
                        document.getElementById('nav-eta').textContent = `${totalTimeMinutes} ${t('mins')} (${totalDistKm} ${t('km')})`;
                        playAlertTone(); speakAlert(`${t('route_found')}. ${totalTimeMinutes} ${t('mins')}.`);
                    });
                    
                    routingControl.on('routingerror', function(e) {
                        showToast("تعذر رسم المسار، تأكد من الاتصال بالانترنت", "error");
                        document.getElementById('nav-eta').textContent = "خطأ في الشبكة";
                    });

                } catch(e) {
                    showToast("خطأ في الملاحة", "error");
                }
            }

            document.getElementById('btn-cancel-route').addEventListener('click', () => {
                if (routingControl) { map.removeControl(routingControl); routingControl = null; }
                document.getElementById('nav-banner').classList.add('hidden'); document.getElementById('search-container').classList.remove('hidden');
                document.querySelectorAll('.custom-dest').forEach(el => el.remove()); speakAlert(t('nav_cancel'));
            });

            // 5. نظام بحث Mapbox المحمي
            const searchInput = document.getElementById('search-input'), searchResults = document.getElementById('search-results'), btnClearSearch = document.getElementById('btn-clear-search'), searchSpinner = document.getElementById('search-spinner');
            let searchTimeout = null;

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                if (query.length > 0) btnClearSearch.classList.remove('hidden'); else btnClearSearch.classList.add('hidden');
                clearTimeout(searchTimeout);
                if (query.length < 3) { searchResults.classList.add('hidden'); if (searchSpinner) searchSpinner.classList.add('hidden'); return; }
                if (searchSpinner) searchSpinner.classList.remove('hidden');

                searchTimeout = setTimeout(async () => {
                    try {
                        const langQuery = currentLang === 'ku' ? 'ar' : currentLang;
                        const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?country=iq&language=${langQuery}&access_token=${window.MAPBOX_API_KEY}`);
                        if(!res.ok) throw new Error("Network Error");
                        const data = await res.json();
                        let features = data.features || [];
                        
                        if (userLocationMarker && features.length > 0) {
                            const userPos = userLocationMarker.getLatLng();
                            features.forEach(item => { item.distance = map.distance(userPos, L.latLng(item.center[1], item.center[0])); });
                            features.sort((a, b) => a.distance - b.distance);
                        }
                        
                        searchResults.innerHTML = '';
                        if (features.length === 0) { 
                            searchResults.innerHTML = `<div class="p-4 text-center text-gray-500 font-bold">${t('no_results')}</div>`; 
                        } else {
                            features.slice(0, 5).forEach(item => {
                                const div = document.createElement('div');
                                let mainName = item.text || 'موقع غير معروف';
                                if (mainName.length > 30) mainName = mainName.substring(0, 30) + '...';
                                let subNameParts = []; if(item.context) { item.context.forEach(c => { if(!c.id.startsWith('country')) subNameParts.push(c.text); }); }
                                let subName = subNameParts.join('، '); if(!subName) subName = item.place_name.replace(mainName + ', ', '');

                                let distStr = '';
                                if (item.distance) {
                                    distStr = item.distance > 1000 ? `<div class="text-[11px] bg-brand-50 text-brand-700 px-2 py-1 rounded-md font-bold whitespace-nowrap">${(item.distance / 1000).toFixed(1)} ${t('km')}</div>` : `<div class="text-[11px] bg-brand-50 text-brand-700 px-2 py-1 rounded-md font-bold whitespace-nowrap">${Math.round(item.distance)} ${t('meter')}</div>`;
                                }
                                div.className = 'p-3 border-b border-gray-100 hover:bg-gray-50 cursor-pointer flex items-center gap-3 transition-colors text-start pointer-events-auto';
                                div.innerHTML = `<div class="bg-brand-100 w-10 h-10 rounded-full flex items-center justify-center shrink-0"><i class="fas fa-map-marker-alt text-brand-600 text-lg"></i></div><div class="flex-1 min-w-0"><div class="text-sm font-black text-gray-800 truncate">${mainName}</div><div class="text-xs font-medium text-gray-500 truncate mt-0.5">${subName}</div></div>${distStr}`;
                                div.onclick = () => window.drawRoute(item.center[1], item.center[0], mainName); 
                                searchResults.appendChild(div);
                            });
                        }
                        searchResults.classList.remove('hidden'); if (searchSpinner) searchSpinner.classList.add('hidden');
                    } catch (err) { 
                        if (searchSpinner) searchSpinner.classList.add('hidden'); 
                    }
                }, 600);
            });

            btnClearSearch.addEventListener('click', () => { searchInput.value = ''; searchResults.classList.add('hidden'); btnClearSearch.classList.add('hidden'); });

            // 6. GPS والمسار المحمي
            let lastLat = null, lastLng = null, lastTime = null;
            function checkHazardsProximity(userLat, userLng) {
                try {
                    const userLatLng = L.latLng(userLat, userLng); const CONFIG = getReportConfig();
                    for (const id in markersData) {
                        const report = markersData[id]; const distance = map.distance(userLatLng, L.latLng(report.lat, report.lng));
                        if (distance < 600 && !alertedMarkers.has(id)) { alertedMarkers.add(id); playAlertTone(); speakAlert(`${CONFIG[report.type].name} ${t('dist_away')} 500 ${t('meter')}.`); }
                    }
                } catch(e){}
            }

            const btnLocation = document.getElementById('btn-location'), locationIcon = document.getElementById('location-icon'), speedometer = document.getElementById('speedometer'), speedValue = document.getElementById('speed-value');

            btnLocation.addEventListener('click', () => {
                enableAudio(); 
                if (!navigator.geolocation) { showToast(t('gps_error'), 'error'); return; }
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId); watchId = null;
                    locationIcon.classList.replace('fa-location-dot', 'fa-location-crosshairs'); locationIcon.classList.replace('text-green-500', 'text-brand-600');
                    speedometer.classList.add('hidden'); speakAlert(t('gps_stop')); showToast(t('gps_stop'), 'info');
                } else {
                    showToast(t('sat_connect'), 'info'); locationIcon.className = 'fas fa-spinner fa-spin text-xl text-brand-600'; speedometer.classList.remove('hidden');
                    try {
                        watchId = navigator.geolocation.watchPosition(
                            (position) => {
                                const lat = position.coords.latitude, lng = position.coords.longitude; let speedKmh = 0;
                                if (position.coords.speed !== null && position.coords.speed > 0) speedKmh = Math.round(position.coords.speed * 3.6);
                                else if (lastLat && lastLng && lastTime) { const dist = map.distance(L.latLng(lastLat, lastLng), L.latLng(lat, lng)), timeDiff = (position.timestamp - lastTime) / 1000; if (timeDiff > 0) speedKmh = Math.round((dist / timeDiff) * 3.6); }
                                if (speedKmh < 3) speedKmh = 0; speedValue.textContent = speedKmh;

                                let heading = position.coords.heading;
                                if ((heading === null || isNaN(heading)) && lastLat && lastLng && speedKmh > 5) {
                                    const dLng = (lng - lastLng) * Math.PI / 180, lat1 = lastLat * Math.PI / 180, lat2 = lat * Math.PI / 180;
                                    const y = Math.sin(dLng) * Math.cos(lat2), x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
                                    heading = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
                                }
                                lastLat = lat; lastLng = lng; lastTime = position.timestamp; locationIcon.className = 'fas fa-location-dot text-xl text-green-500';
                                let rotationStyle = heading ? `transform: rotate(${heading}deg);` : 'transform: rotate(0deg);';
                                const arrowHtml = `<div class="user-nav-arrow" style="${rotationStyle}"><i class="fas fa-location-arrow"></i></div>`;

                                if (!userLocationMarker) {
                                    userLocationMarker = L.marker([lat, lng], { icon: L.divIcon({ html: arrowHtml, className: 'border-0 bg-transparent', iconSize: [50, 50], iconAnchor: [25, 25] }), zIndexOffset: 2000 }).addTo(map);
                                    map.flyTo([lat, lng], 17, { animate: true });
                                } else {
                                    userLocationMarker.setLatLng([lat, lng]); userLocationMarker.setIcon(L.divIcon({ html: arrowHtml, className: 'border-0 bg-transparent', iconSize: [50, 50], iconAnchor: [25, 25] }));
                                    map.panTo([lat, lng], { animate: true, duration: 1.0 }); 
                                }
                                checkHazardsProximity(lat, lng);
                            },
                            (error) => { showToast(t('gps_error'), 'error'); locationIcon.className = 'fas fa-location-crosshairs text-xl text-brand-600'; watchId = null; speedometer.classList.add('hidden'); },
                            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                        );
                    } catch(e) { showToast('GPS Error', 'error'); }
                }
            });

            // الأماكن المحفوظة
            function updateSavedPlacesUI() { 
                try {
                    ['home', 'work'].forEach(type => { const data = localStorage.getItem(`traffix_${type}`); const statusEl = document.getElementById(`${type}-status`); if(data) { const parsed = JSON.parse(data); statusEl.textContent = `مضبوط (${parsed.lat.toFixed(4)}, ...)`; statusEl.classList.add('text-green-500'); } else { statusEl.textContent = 'غير محدد'; statusEl.classList.remove('text-green-500'); } }); 
                } catch(e) {}
            }
            
            document.querySelectorAll('.btn-set-place').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const type = e.currentTarget.getAttribute('data-place');
                    try {
                        const pos = userLocationMarker ? userLocationMarker.getLatLng() : map.getCenter(); localStorage.setItem(`traffix_${type}`, JSON.stringify({ lat: pos.lat, lng: pos.lng })); showToast(t('set_success'), 'success'); updateSavedPlacesUI();
                    } catch(err) { showToast('Storage Error', 'error'); }
                });
            });

            document.querySelectorAll('.btn-route-place').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const type = e.currentTarget.getAttribute('data-place');
                    try {
                        const data = localStorage.getItem(`traffix_${type}`); if(data) { const parsed = JSON.parse(data); document.getElementById('routes-modal').classList.add('hidden'); window.drawRoute(parsed.lat, parsed.lng, t(type)); } else showToast('الرجاء تحديد المكان أولاً', 'error'); 
                    } catch(err) {}
                });
            });

            // 7. فايربيس الآمن
            async function initUserProfile(appId) {
                if (!currentUser || !db) return;
                try {
                    const userRef = db.doc(`artifacts/${appId}/users/${currentUser.uid}/profile`);
                    const docSnap = await userRef.get();
                    if (!docSnap.exists) await userRef.set({ points: 0, rank: 'beginner', isRegistered: false });
                    userRef.onSnapshot((doc) => {
                        if(doc.exists) {
                            const data = doc.data(); document.getElementById('user-badge').textContent = data.points; document.getElementById('profile-points').textContent = data.points;
                            let rankKey = 'beginner'; if (data.points > 50) rankKey = 'expert'; if (data.points > 200) rankKey = 'pro'; if (data.points > 500) rankKey = 'king'; document.getElementById('profile-rank').textContent = t(rankKey);
                            if(data.isRegistered) { document.getElementById('profile-name').textContent = t('verified'); document.getElementById('profile-desc').textContent = t('member'); document.getElementById('profile-avatar').className = "w-24 h-24 bg-gradient-to-br from-brand-500 to-pink-500 rounded-full mx-auto mb-4 flex items-center justify-center shadow-lg border-4 border-white dark:border-darkbg"; document.getElementById('profile-avatar').innerHTML = '<i class="fas fa-car-side text-4xl text-white"></i>'; document.getElementById('btn-login').classList.add('hidden'); }
                        }
                    });
                } catch(e) {}
            }

            document.getElementById('btn-login').addEventListener('click', async () => { const appId = typeof __app_id !== 'undefined' ? __app_id : 'iraq-map-app'; if(currentUser && db) { try { const userRef = db.doc(`artifacts/${appId}/users/${currentUser.uid}/profile`); await userRef.update({ isRegistered: true, points: firebase.firestore.FieldValue.increment(50) }); showToast(t('auth_success') + " (+50 " + t('points') + ")", "success"); } catch(e){} } });

            function listenToMapReports(appId) {
                if (!currentUser || !db) return;
                try {
                    const collectionPath = db.collection(`artifacts/${appId}/public/data/map_reports`);
                    collectionPath.onSnapshot((snapshot) => { snapshot.docChanges().forEach((change) => { const data = change.doc.data(), id = change.doc.id, now = new Date().getTime(), reportTime = data.timestamp ? data.timestamp.toDate().getTime() : now, hoursDiff = (now - reportTime) / (1000 * 60 * 60); if (hoursDiff > 3) { removeMarkerFromUI(id); return; } if (change.type === "added" || change.type === "modified") { addMarkerToUI(id, data); markersData[id] = data; } if (change.type === "removed") { removeMarkerFromUI(id); delete markersData[id]; alertedMarkers.delete(id); } }); }, (error) => {});
                } catch(e){}
            }

            window.voteReport = async function(id, isConfirm) {
                enableAudio(); if (!currentUser || !db) return; const appId = typeof __app_id !== 'undefined' ? __app_id : 'iraq-map-app', docRef = db.doc(`artifacts/${appId}/public/data/map_reports/${id}`), userRef = db.doc(`artifacts/${appId}/users/${currentUser.uid}/profile`);
                try { if (isConfirm) { await docRef.update({ confirms: firebase.firestore.FieldValue.increment(1) }); await userRef.update({ points: firebase.firestore.FieldValue.increment(2) }); showToast(t('vote_sent'), "success"); } else { await docRef.update({ denies: firebase.firestore.FieldValue.increment(1) }); } map.closePopup(); } catch (e) {}
            };

            function addMarkerToUI(id, data) {
                if (!data.lat || !data.lng || !data.type) return; const CONFIG = getReportConfig(), config = CONFIG[data.type] || CONFIG['hazard']; removeMarkerFromUI(id);
                const customDivIcon = L.divIcon({ html: `<div class="marker-icon-container ${config.bgClass}"><i class="fas ${config.icon} ${config.color} text-2xl drop-shadow-md"></i></div><div style="width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 10px solid ${document.documentElement.classList.contains('dark') ? '#0f172a' : 'white'}; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);"></div>`, className: 'custom-marker', iconSize: [48, 58], iconAnchor: [24, 58], popupAnchor: [0, -55] });
                const marker = L.marker([data.lat, data.lng], { icon: customDivIcon }).addTo(map); let timeStr = t('now'); if (data.timestamp && data.timestamp.toDate) timeStr = new Date(data.timestamp.toDate()).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }); const confirms = data.confirms || 0, commentHtml = data.comment ? `<div class="bg-gray-50 p-2 rounded mt-2 text-xs text-gray-700 italic border border-gray-100">"${data.comment}"</div>` : '';
                marker.bindPopup(`<div class="text-center p-2 min-w-[180px] font-tajawal text-start" dir="${document.documentElement.dir}"><div class="font-black text-gray-900 text-lg">${config.name}</div><div class="text-xs text-gray-500 font-bold mb-2"><i class="far fa-clock mx-1"></i> ${timeStr}</div>${commentHtml}<div class="mt-3 pt-3 border-t border-gray-100 flex gap-2 justify-center"><button onclick="voteReport('${id}', true)" class="flex-1 bg-brand-50 text-brand-600 rounded-lg py-1.5 text-xs font-bold hover:bg-brand-100"><i class="fas fa-thumbs-up mx-1"></i> ${t('exist')} (${confirms})</button><button onclick="voteReport('${id}', false)" class="flex-1 bg-gray-50 text-gray-600 rounded-lg py-1.5 text-xs font-bold hover:bg-gray-200"><i class="fas fa-thumbs-down mx-1"></i></button></div></div>`);
                markersMap[id] = marker;
            }

            function removeMarkerFromUI(id) { if (markersMap[id]) { map.removeLayer(markersMap[id]); delete markersMap[id]; } }

            document.querySelectorAll('.report-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const reportType = e.currentTarget.getAttribute('data-report');
                    enableAudio(); document.getElementById('report-menu').classList.add('hidden'); const commentInput = document.getElementById('report-comment'), comment = commentInput.value.trim(); commentInput.value = ''; const pos = userLocationMarker ? userLocationMarker.getLatLng() : map.getCenter();
                    if (!currentUser || !db) { const fakeId = 'demo_' + Date.now(); addMarkerToUI(fakeId, { type: reportType, lat: pos.lat, lng: pos.lng, comment: comment, confirms: 1 }); showToast(t('offline_mode'), 'success'); return; }
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'iraq-map-app';
                    try { await db.collection(`artifacts/${appId}/public/data/map_reports`).add({ type: reportType, lat: pos.lat, lng: pos.lng, comment: comment, timestamp: firebase.firestore.FieldValue.serverTimestamp(), userId: currentUser.uid, confirms: 1, denies: 0 }); const userRef = db.doc(`artifacts/${appId}/users/${currentUser.uid}/profile`); await userRef.update({ points: firebase.firestore.FieldValue.increment(10) }); showToast(t('report_sent') + ' (+10 pts)', 'success'); } catch (error) { showToast('Error', 'error'); }
                });
            });

            // تشغيل الفايربيس إن وجد
            setTimeout(async () => {
                try {
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'iraq-map-app';
                    const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
                    if (configStr && firebase && firebase.apps.length === 0) {
                        firebase.initializeApp(JSON.parse(configStr)); auth = firebase.auth(); db = firebase.firestore();
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await auth.signInWithCustomToken(__initial_auth_token); } else { await auth.signInAnonymously(); }
                        currentUser = auth.currentUser; initUserProfile(appId); listenToMapReports(appId);
                    }
                } catch(e) { console.warn("Firebase not active"); }
            }, 2000);

        })(); // نهاية صندوق الحماية
    </script>
</body>
</html>
